name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests and bundles
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node -e "for (const file of ['package.json', 'screenshots.json']) JSON.parse(require('node:fs').readFileSync(file, 'utf8'))"
          npm pack --dry-run
